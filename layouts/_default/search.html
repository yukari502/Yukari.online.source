{{ define "main" }}
<main class="main" role="main">
    <article class="post-entry">
        <header class="post-header">
            <h1 class="post-title">{{ .Title }}</h1>
        </header>
        <div class="post-content clearfix">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Type to search..."
                    style="width: 100%; padding: 10px; font-size: 16px; margin-bottom: 20px;">
                <ul id="results-container" style="list-style: none; padding: 0;"></ul>
            </div>
        </div>
    </article>
</main>
<script src="https://unpkg.com/lunr/lunr.js"></script>
<script src="https://unpkg.com/lunr-languages/lunr.stemmer.support.js"></script>
<script src="https://unpkg.com/lunr-languages/lunr.zh.js"></script>
<script src="/js/search.js"></script>
{{ end }}
