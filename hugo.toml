baseURL = "yukari.online" # 请替换为你自己的域名
languageCode = "en-us"
title = "Yukari's Blog"            # 对应图中顶部大标题
theme = "Mainroad"
hasCJKLanguage = true  # 开启中日韩语言自动检测，这会让 Hugo 正确识别中文摘要
summaryLength = 30     # 设置自动截取的摘要长度（单位是字数），你可以改成 30 或 50

[params]
  description = "Yukari's blog" # 网站描述
  # 对应图中红色小副标题 "JUST ANOTHER SITE"
  readmore = true # 确保这一项是 true，或者是默认值（不写就是默认）
  [params.logo]
    subtitle = "Just   site" 

  # 侧边栏设置 (对应图中右侧布局)
  [params.sidebar]
    home = "right"    # 首页侧边栏在右边
    list = "right"    # 列表页侧边栏在右边
    single = "right"  # 文章页侧边栏在右边
    # 对应图中右侧的组件顺序：搜索 -> 最近文章 -> 分类 -> 标签云
    widgets = ["search", "categories", "recent", "taglist"]

  # 文章元数据设置 (对应图中文章标题下的日期)
  post_meta = ["date", "categories"] 

# -----------------------------------------------------------
# 顶部导航菜单 (Personal Blog Standard)
# -----------------------------------------------------------

[[menu.main]]
  identifier = "home"
  name = "Home"       # Home
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "Archives"       # Archives (对应你的 /post/ 目录)
  url = "/posts/"
  weight = 20


[[menu.main]]
  identifier = "categories"
  name = "Categories"       # Categories (Hugo 自动生成)
  url = "/categories/"
  weight = 40

  
[[menu.main]]
  identifier = "tags"
  name = "Tags"       # Tags (Hugo 自动生成)
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "About"       # About (你需要手动创建 content/about.md)
  url = "/about/"
  weight = 50